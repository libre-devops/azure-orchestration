name: MDE RHEL offline VM - deploy

# Builds or updates the RHEL VMs in stacks/mde-rhel-offline, one per release in rhel_releases (7, 8
# and 9 by default), which have no route to the internet, and installs Defender for Endpoint on
# them, in ONE apply with configure=true:
#
#   download  libre_devops.rpm_repo_download fetches each release's mdatp RPM on the runner, which
#             has the internet, checking the repository's signature and every checksum
#   open      the bastion-session module creates an Azure Bastion and fetches the vaulted SSH key
#   python    libre_devops.python pushes a Python current ansible-core can use to RHEL 7 and 8
#   install   libre_devops.standalone_package_installer pushes the RPM through it and installs it
#             from the file alone, then libre_devops.mde_linux starts the agent
#   test      libre_devops.mde_linux_checks tests the release and libre_devops.test_results_report
#             writes the report (also the job summary), failing the apply if the release fails
#   close     the module deletes the bastion and its public IP once the tests have finished
#
# The report and the evidence are uploaded as the test-results artifact, whatever happened.
# Then, ALWAYS, the session's close script: a failed install skips the module's close step, so this
# deletes the bastion straight away (it does nothing when the apply closed it). Last, when
# destroy_after is ticked, the stack is destroyed (end-to-end runs).
#
# The mde-rhel-offline-close-access workflow sweeps up a bastion a hard-cancelled run could leave.
on:
  workflow_dispatch:
    inputs:
      workspace:
        description: Terraform workspace (environment).
        type: string
        default: dev
      mde_version:
        description: The mdatp version to install, such as 101.26101.0000, or latest.
        type: string
        default: latest
      rhel_releases:
        description: The RHEL releases to test, one VM each, comma-separated (any of 7, 8 and 9).
        type: string
        default: 7,8,9
      destroy_after:
        description: Destroy the whole stack after the run (an end-to-end test).
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

# One run per environment at a time; the close-access sweeper shares the group.
concurrency:
  group: mde-rhel-offline-${{ inputs.workspace }}
  cancel-in-progress: false

env:
  # Matches the stack's naming (rg-mdo-<short>-<loc>-<workspace>-001).
  RESOURCE_GROUP: rg-mdo-ldo-uks-${{ inputs.workspace }}-001
  KEY_VAULT: kv-mdo-ldo-uks-${{ inputs.workspace }}-001
  # Where the bastion-session module keeps its scripts and its working directory (module call
  # bastion_session, session name mde-rhel-offline), for the always() close step.
  SESSION_CLOSE: stacks/mde-rhel-offline/.terraform/modules/bastion_session/scripts/close.sh
  SESSION_DIR: stacks/mde-rhel-offline/.terraform/bastion-session/mde-rhel-offline

jobs:
  deploy:
    name: Deploy and configure (${{ inputs.workspace }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # Every Terraform step passes the runner as key_vault_ip_rules (see the stack's variable), and
      # the action's key vault dance removes the rule after each step. This also installs
      # LibreDevOpsHelpers for the bastion session's key fetch.
      - name: Find the runner's egress IP
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module LibreDevOpsHelpers -Scope CurrentUser -Force -AllowClobber
          Import-Module LibreDevOpsHelpers
          $ip = Get-LdoPublicIpAddress
          "RUNNER_IP=$ip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TF_VAR_key_vault_ip_rules=[""$ip/32""]" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # terraform-ansible-role runs ansible-playbook on the runner, and installs the roles itself.
      - name: Install Ansible
        run: pipx install ansible-core

      # The stack's rhel_releases list: 7,8,9 becomes ["7","8","9"], and anything else stops here.
      - name: Choose the RHEL releases
        env:
          RELEASES: ${{ inputs.rhel_releases }}
        run: |
          list=$(python3 -c 'import json, os; r = [x.strip() for x in os.environ["RELEASES"].split(",") if x.strip()]; assert r and set(r) <= {"7", "8", "9"}, "rhel_releases: any of 7, 8 and 9"; print(json.dumps(sorted(set(r))))')
          echo "TF_VAR_rhel_releases=${list}" >>"${GITHUB_ENV}"

      # Recorded in the test report, so it says which run produced it.
      - name: Note the run in the test report
        run: echo "TF_VAR_run_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >>"${GITHUB_ENV}"

      - name: Apply and install (configure=true)
        uses: libre-devops/terraform-azure@v1
        with:
          terraform-code-location: stacks
          terraform-stack-to-run-json: '["mde-rhel-offline"]'
          terraform-workspace: ${{ inputs.workspace }}
          run-terraform-plan: true
          run-terraform-apply: true
          terraform-plan-extra-args-json: '["-var=configure=true","-var=mde_version=${{ inputs.mde_version }}"]'
          arm-client-id: ${{ vars.AZURE_CLIENT_ID }}
          arm-tenant-id: ${{ vars.AZURE_TENANT_ID }}
          arm-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          firewall-storage-account-name: ${{ secrets.TFSTATE_STORAGE_ACCOUNT }}
          firewall-storage-resource-group: ${{ secrets.TFSTATE_RESOURCE_GROUP }}
          add-current-ip-to-key-vault-before-tf-run: true
          firewall-key-vault-name: ${{ env.KEY_VAULT }}
          firewall-key-vault-resource-group: ${{ env.RESOURCE_GROUP }}
          key-vault-firewall-soft-fail: true
          terraform-init-extra-args-json: '["-reconfigure","-upgrade","-backend-config=resource_group_name=${{ secrets.TFSTATE_RESOURCE_GROUP }}","-backend-config=storage_account_name=${{ secrets.TFSTATE_STORAGE_ACCOUNT }}","-backend-config=container_name=${{ secrets.TFSTATE_BLOB_CONTAINER }}"]'

      # A fresh sign-in, in case the apply ran long enough for the action's to lapse.
      - name: Sign the Azure CLI in for the close step
        if: always()
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Reads the session.json the open step left, so it needs no Terraform state; does nothing when
      # the apply closed the session itself or never got as far as opening one.
      - name: Close the bastion session (always, even when the apply failed)
        if: always()
        run: |
          set -euo pipefail
          if [ -x "${SESSION_CLOSE}" ]; then
            "${SESSION_CLOSE}" "${SESSION_DIR}"
          else
            echo "Terraform never downloaded the bastion-session module, so no session was opened."
          fi

      # The report (Markdown, JSON, JUnit XML) and the evidence: what the probes read, and
      # Microsoft's diagnostic package when a check failed.
      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ inputs.workspace }}
          path: stacks/mde-rhel-offline/.terraform/test-results/
          if-no-files-found: warn

      - name: Destroy the stack (end-to-end runs)
        if: always() && inputs.destroy_after
        uses: libre-devops/terraform-azure@v1
        with:
          terraform-code-location: stacks
          terraform-stack-to-run-json: '["mde-rhel-offline"]'
          terraform-workspace: ${{ inputs.workspace }}
          run-terraform-plan: false
          run-terraform-plan-destroy: true
          run-terraform-destroy: true
          arm-client-id: ${{ vars.AZURE_CLIENT_ID }}
          arm-tenant-id: ${{ vars.AZURE_TENANT_ID }}
          arm-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          firewall-storage-account-name: ${{ secrets.TFSTATE_STORAGE_ACCOUNT }}
          firewall-storage-resource-group: ${{ secrets.TFSTATE_RESOURCE_GROUP }}
          add-current-ip-to-key-vault-before-tf-run: true
          firewall-key-vault-name: ${{ env.KEY_VAULT }}
          firewall-key-vault-resource-group: ${{ env.RESOURCE_GROUP }}
          key-vault-firewall-soft-fail: true
          terraform-init-extra-args-json: '["-reconfigure","-upgrade","-backend-config=resource_group_name=${{ secrets.TFSTATE_RESOURCE_GROUP }}","-backend-config=storage_account_name=${{ secrets.TFSTATE_STORAGE_ACCOUNT }}","-backend-config=container_name=${{ secrets.TFSTATE_BLOB_CONTAINER }}"]'
