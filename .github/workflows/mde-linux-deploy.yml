name: MDE Linux VM - deploy

# Builds or updates the Ubuntu VM in stacks/mde-linux and installs Defender for Endpoint on it, in
# ONE apply with configure=true:
#
#   open    the bastion-session module creates an Azure Bastion and the runner's sign-in (an Entra
#           ID certificate and role, or the vaulted SSH key)
#   run     terraform-ansible-role runs libre_devops.python, then libre_devops.mde_linux, through it
#   close   the module deletes the bastion, its public IP and the role once both have finished
#
# Then, ALWAYS, the session's close script: a failed role run skips the module's close step, so this
# deletes the bastion straight away (it does nothing when the apply closed it). Last, when
# destroy_after is ticked, the stack is destroyed (end-to-end runs).
#
# The mde-linux-close-access workflow sweeps up a bastion a hard-cancelled run could leave behind.
on:
  workflow_dispatch:
    inputs:
      workspace:
        description: Terraform workspace (environment).
        type: string
        default: dev
      ssh_auth:
        description: How Ansible signs in - entra (short-lived Entra ID certificate) or key (the admin account's vaulted SSH key).
        type: choice
        options: [entra, key]
        default: entra
      destroy_after:
        description: Destroy the whole stack after the run (an end-to-end test).
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

# One run per environment at a time; the close-access sweeper shares the group.
concurrency:
  group: mde-linux-${{ inputs.workspace }}
  cancel-in-progress: false

env:
  # Matches the stack's naming (rg-mde-<short>-<loc>-<workspace>-001).
  RESOURCE_GROUP: rg-mde-ldo-uks-${{ inputs.workspace }}-001
  KEY_VAULT: kv-mde-ldo-uks-${{ inputs.workspace }}-001
  # Where the bastion-session module keeps its scripts and its working directory (module call
  # bastion_session, session name mde-linux), for the always() close step.
  SESSION_CLOSE: stacks/mde-linux/.terraform/modules/bastion_session/scripts/close.sh
  SESSION_DIR: stacks/mde-linux/.terraform/bastion-session/mde-linux
  # Optional: the organisation the role checks the device onboarded to.
  TF_VAR_mde_expected_org_id: ${{ vars.MDE_EXPECTED_ORG_ID }}

jobs:
  deploy:
    name: Deploy and configure (${{ inputs.workspace }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # Every Terraform step passes the runner as key_vault_ip_rules (see the stack's variable), and
      # the action's key vault dance removes the rule after each step. This also installs
      # LibreDevOpsHelpers for the bastion session's key fetch.
      - name: Find the runner's egress IP
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module LibreDevOpsHelpers -Scope CurrentUser -Force -AllowClobber
          Import-Module LibreDevOpsHelpers
          $ip = Get-LdoPublicIpAddress
          "RUNNER_IP=$ip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TF_VAR_key_vault_ip_rules=[""$ip/32""]" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # terraform-ansible-role runs ansible-playbook on the runner, and installs the roles itself.
      - name: Install Ansible
        run: pipx install ansible-core

      # Optional: without the secret the agent installs but is not onboarded.
      - name: Write the onboarding package to a private temporary file
        env:
          MDE_ONBOARDING_JSON: ${{ secrets.MDE_ONBOARDING_JSON }}
        run: |
          set -euo pipefail
          if [ -n "${MDE_ONBOARDING_JSON}" ]; then
            umask 077
            printf '%s' "${MDE_ONBOARDING_JSON}" >"${RUNNER_TEMP}/mdatp_onboard.json"
            echo "TF_VAR_mde_onboarding_file=${RUNNER_TEMP}/mdatp_onboard.json" >>"${GITHUB_ENV}"
          else
            echo "::notice::MDE_ONBOARDING_JSON is not set: installing the agent without onboarding."
          fi

      - name: Apply and configure (configure=true)
        uses: libre-devops/terraform-azure@v1
        with:
          terraform-code-location: stacks
          terraform-stack-to-run-json: '["mde-linux"]'
          terraform-workspace: ${{ inputs.workspace }}
          run-terraform-plan: true
          run-terraform-apply: true
          terraform-plan-extra-args-json: '["-var=configure=true","-var=ssh_auth=${{ inputs.ssh_auth }}"]'
          arm-client-id: ${{ vars.AZURE_CLIENT_ID }}
          arm-tenant-id: ${{ vars.AZURE_TENANT_ID }}
          arm-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          firewall-storage-account-name: ${{ secrets.TFSTATE_STORAGE_ACCOUNT }}
          firewall-storage-resource-group: ${{ secrets.TFSTATE_RESOURCE_GROUP }}
          add-current-ip-to-key-vault-before-tf-run: true
          firewall-key-vault-name: ${{ env.KEY_VAULT }}
          firewall-key-vault-resource-group: ${{ env.RESOURCE_GROUP }}
          key-vault-firewall-soft-fail: true
          terraform-init-extra-args-json: '["-reconfigure","-upgrade","-backend-config=resource_group_name=${{ secrets.TFSTATE_RESOURCE_GROUP }}","-backend-config=storage_account_name=${{ secrets.TFSTATE_STORAGE_ACCOUNT }}","-backend-config=container_name=${{ secrets.TFSTATE_BLOB_CONTAINER }}"]'

      - name: Remove the onboarding package
        if: always()
        run: rm -f "${RUNNER_TEMP}/mdatp_onboard.json"

      # A fresh sign-in, in case the apply ran long enough for the action's to lapse.
      - name: Sign the Azure CLI in for the close step
        if: always()
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Reads the session.json the open step left, so it needs no Terraform state; does nothing when
      # the apply closed the session itself or never got as far as opening one.
      - name: Close the bastion session (always, even when the apply failed)
        if: always()
        run: |
          set -euo pipefail
          if [ -x "${SESSION_CLOSE}" ]; then
            "${SESSION_CLOSE}" "${SESSION_DIR}"
          else
            echo "Terraform never downloaded the bastion-session module, so no session was opened."
          fi

      - name: Destroy the stack (end-to-end runs)
        if: always() && inputs.destroy_after
        uses: libre-devops/terraform-azure@v1
        with:
          terraform-code-location: stacks
          terraform-stack-to-run-json: '["mde-linux"]'
          terraform-workspace: ${{ inputs.workspace }}
          run-terraform-plan: false
          run-terraform-plan-destroy: true
          run-terraform-destroy: true
          arm-client-id: ${{ vars.AZURE_CLIENT_ID }}
          arm-tenant-id: ${{ vars.AZURE_TENANT_ID }}
          arm-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          firewall-storage-account-name: ${{ secrets.TFSTATE_STORAGE_ACCOUNT }}
          firewall-storage-resource-group: ${{ secrets.TFSTATE_RESOURCE_GROUP }}
          add-current-ip-to-key-vault-before-tf-run: true
          firewall-key-vault-name: ${{ env.KEY_VAULT }}
          firewall-key-vault-resource-group: ${{ env.RESOURCE_GROUP }}
          key-vault-firewall-soft-fail: true
          terraform-init-extra-args-json: '["-reconfigure","-upgrade","-backend-config=resource_group_name=${{ secrets.TFSTATE_RESOURCE_GROUP }}","-backend-config=storage_account_name=${{ secrets.TFSTATE_STORAGE_ACCOUNT }}","-backend-config=container_name=${{ secrets.TFSTATE_BLOB_CONTAINER }}"]'
