[defaults]
# Relative to this file. Install with: ansible-galaxy role install -r ansible/requirements.yml
roles_path = ./roles
interpreter_python = auto_silent
# Host keys are pinned per VM through HostKeyAlias in a per-run known_hosts (see
# scripts/bastion-ansible.sh), so checking stays on.
host_key_checking = True
forks = 10

[ssh_connection]
pipelining = True
