---
# Defender for Endpoint on every VM tagged AnsibleGroups=mde_linux. Run through the access window's
# bastion by scripts/bastion-ansible.sh, which builds the inventory and the Entra ID SSH config.
- name: Defender for Endpoint on the Linux VMs
  hosts: mde_linux
  become: true
  gather_facts: false

  vars:
    # Path to mdatp_onboard.json from the Defender portal. The deploy workflow writes the
    # MDE_ONBOARDING_JSON secret to a 0600 temporary file and passes its path here. Empty installs
    # the agent without onboarding (the role's mde_linux_onboard: false).
    mde_onboarding_file: "{{ lookup('ansible.builtin.env', 'MDE_ONBOARDING_FILE') }}"

  pre_tasks:
    - name: Wait for Entra ID SSH through the tunnel (a new sign-in role can take a minute to apply)
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Gather facts
      ansible.builtin.setup:

  roles:
    - role: libre_devops.mde_linux
      vars:
        mde_linux_onboard: "{{ mde_onboarding_file | length > 0 }}"
        mde_linux_onboarding_file: "{{ mde_onboarding_file }}"
        mde_linux_expected_org_id: "{{ lookup('ansible.builtin.env', 'MDE_EXPECTED_ORG_ID') }}"

  post_tasks:
    - name: Read the agent version
      ansible.builtin.command: mdatp version
      register: mde_version
      changed_when: false

    - name: Read the agent health
      ansible.builtin.command: mdatp health --field healthy
      register: mde_healthy
      changed_when: false
      failed_when: false

    - name: Report the agent state
      ansible.builtin.debug:
        msg: >-
          {{ mde_version.stdout | trim }}; onboarded this run: {{ mde_onboarding_file | length > 0 }};
          mdatp health --field healthy: {{ mde_healthy.stdout | default('') | trim }}
